name: Website

on:
  push:
    branches: [main]
    paths:
      - 'examples/website/**'
      - 'crates/**'
      - 'hosts/web/**'
      - 'scripts/build.py'
      - 'scripts/build_website.py'
      - 'scripts/check_website.mjs'
      - 'Cargo.*'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build_website.py
      - run: npm install --prefix target/web-tools --no-save playwright@1.62.1
      - run: npx --prefix target/web-tools playwright install --with-deps chromium
      - run: node scripts/check_website.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/target/web-tools/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-screenshots
          path: target/website-check/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web/rusterize-website
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
