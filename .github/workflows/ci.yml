name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/build.py --platform web
      - run: python scripts/build.py --platform web --package rusterize-native-api
      - run: cargo build --release --target wasm32-unknown-unknown -p rusterize-gallery --example web_checks --locked
      - run: cargo build --release --target wasm32-unknown-unknown -p rusterize-gallery --example web_services --locked
      - run: python scripts/build.py --platform web --package rusterize-shaders --features self-check
      - run: python scripts/build.py --platform web --package rusterize-webview --features self-check
      - run: cargo clippy --target wasm32-unknown-unknown -p rusterize-gallery -p rusterize-native-api -p rusterize-shaders -p rusterize-webview --lib --examples --locked -- -D warnings
      - run: npm install --prefix target/web-tools --no-save playwright@1.62.1
      - run: npx --prefix target/web-tools playwright install --with-deps ${{ matrix.browser }}
      - name: Software OpenGL for Firefox
        if: matrix.browser == 'firefox'
        run: sudo apt-get install -y libgl1-mesa-dri libegl1 libglx-mesa0 xvfb
      - run: node scripts/check_web.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/target/web-tools/node_modules
          WEB_BROWSER: ${{ matrix.browser }}
      - run: node scripts/check_web_features.mjs
        if: matrix.browser != 'firefox'
        env:
          NODE_PATH: ${{ github.workspace }}/target/web-tools/node_modules
          WEB_BROWSER: ${{ matrix.browser }}
      - name: Firefox WebGL and browser services
        if: matrix.browser == 'firefox'
        run: xvfb-run -a node scripts/check_web_features.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/target/web-tools/node_modules
          WEB_BROWSER: firefox
          WEB_HEADLESS: '0'
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Build generated app for web
        run: |
          cargo run -p rusterize-cli -- new target/web-starter
          cd target/web-starter
          python scripts/build.py --platform web
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rusterize-web-${{ matrix.browser }}
          path: |
            dist/web/
            target/web-check/*.png

  native:
    name: Native (${{ matrix.platform }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
          - os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libpango1.0-dev libegl1-mesa-dev libgl1-mesa-dri libwebkitgtk-6.0-dev xvfb pkg-config
      - name: Allow WebKit sandbox namespaces on Ubuntu
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces. Permit only bwrap
          # on this ephemeral runner, keeping WebKit's process sandbox enabled.
          sudo apparmor_parser -r <<'PROFILE'
          abi <abi/4.0>,
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
      - name: Test smoke runner
        run: python -m unittest discover -s scripts -p "test_*.py"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Execute WGSL on native OpenGL / Mesa
        if: runner.os != 'Windows'
        run: cargo test -p rusterize-shaders --test gpu --locked -- --ignored --nocapture
      - run: cargo test -p rusterize --no-default-features --locked
      - run: cargo doc --workspace --no-deps --locked
      - name: Package native app
        run: python scripts/build.py --platform ${{ matrix.platform }}
      - name: Package native API example
        run: python scripts/build.py --platform ${{ matrix.platform }} --package rusterize-native-api
      - name: Package WGSL example
        run: python scripts/build.py --platform ${{ matrix.platform }} --package rusterize-shaders
      - name: Package WebView example
        run: python scripts/build.py --platform ${{ matrix.platform }} --package rusterize-webview
      - name: Linux WebView lifecycle smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- python scripts/check_native_webview.py dist/rusterize-webview
        env:
          GTK_A11Y: none
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: macOS WebView lifecycle smoke
        if: runner.os == 'macOS'
        run: python scripts/check_native_webview.py dist/rusterize-webview.app/Contents/MacOS/rusterize-webview
      - name: Windows WebView lifecycle smoke
        if: runner.os == 'Windows'
        run: python scripts/check_native_webview.py dist/webview.exe
      - name: Linux WGSL snapshot
        if: runner.os == 'Linux'
        run: dist/rusterize-shaders --snapshot dist/shaders-linux.png
      - name: macOS WGSL snapshot
        if: runner.os == 'macOS'
        run: dist/rusterize-shaders.app/Contents/MacOS/rusterize-shaders --snapshot dist/shaders-macos.png
      - name: Linux text layout self-check and snapshot
        if: runner.os == 'Linux'
        run: dist/rusterize-native-api --snapshot dist/native-api-linux.png
      - name: macOS text layout self-check and snapshot
        if: runner.os == 'macOS'
        run: dist/rusterize-native-api.app/Contents/MacOS/rusterize-native-api --snapshot dist/native-api-macos.png
      - name: Windows text layout self-check and snapshot
        if: runner.os == 'Windows'
        run: |
          dist/native-api.exe dist/native-api.bgra
          python scripts/bgra_to_png.py dist/native-api.bgra dist/native-api-windows.png --width 800 --height 600
      - name: Linux native snapshot
        if: runner.os == 'Linux'
        run: dist/rusterize-gallery --snapshot dist/gallery-linux.png
      - name: macOS native snapshot
        if: runner.os == 'macOS'
        run: dist/rusterize-gallery.app/Contents/MacOS/rusterize-gallery --snapshot dist/gallery-macos.png
      - name: Windows native snapshot
        if: runner.os == 'Windows'
        run: cargo run -p rusterize-gallery --example snapshot -- dist/gallery.bgra
      - name: Encode Windows snapshot
        if: runner.os == 'Windows'
        run: python scripts/bgra_to_png.py dist/gallery.bgra dist/gallery-windows.png
      - name: Verify executable permissions after unpacking
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p target/package-check
          tar -xzf dist/rusterize-gallery-${{ matrix.platform }}.tar.gz -C target/package-check
          if [[ '${{ matrix.platform }}' == 'linux' ]]; then
            target/package-check/rusterize-gallery --snapshot target/package-check.png
          else
            codesign --verify --deep target/package-check/rusterize-gallery.app
            target/package-check/rusterize-gallery.app/Contents/MacOS/rusterize-gallery --snapshot target/package-check.png
          fi
      - name: Generate a fresh application
        run: cargo run -p rusterize-cli -- new target/ci-app
      - name: Check generated app
        run: cargo check --manifest-path target/ci-app/Cargo.toml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rusterize-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  android:
    name: Android (ARM64 and x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Build and verify APK
        run: python3 scripts/build.py --platform android --ndk "$ANDROID_HOME/ndk/27.2.12479018" --abi arm64-v8a --abi x86_64
      - name: Build native API example
        run: python3 scripts/build.py --platform android --package rusterize-native-api --ndk "$ANDROID_HOME/ndk/27.2.12479018" --abi arm64-v8a --abi x86_64
      - name: Build WGSL example
        run: python3 scripts/build.py --platform android --package rusterize-shaders --ndk "$ANDROID_HOME/ndk/27.2.12479018" --abi arm64-v8a --abi x86_64
      - name: Build WebView example
        run: python3 scripts/build.py --platform android --package rusterize-webview --ndk "$ANDROID_HOME/ndk/27.2.12479018" --abi arm64-v8a --abi x86_64
      - uses: actions/upload-artifact@v6
        with:
          name: rusterize-android
          path: dist/*.apk
          if-no-files-found: error

  core-msrv:
    name: Core (Rust 1.85)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test -p rusterize --no-default-features --locked
      - run: cargo test -p rusterize-shader-build --locked
