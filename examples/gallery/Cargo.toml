[package]
name = "rusterize-gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rusterize_gallery"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
rusterize = { path = "../../crates/rusterize" }

[[bin]]
name = "gallery"
path = "src/main.rs"

[[example]]
name = "web_checks"
path = "examples/web_checks.rs"
crate-type = ["cdylib"]

[[example]]
name = "web_services"
path = "examples/web_services.rs"
crate-type = ["cdylib"]
