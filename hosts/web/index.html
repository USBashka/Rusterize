<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101923">
<title>Rusterize</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101923; }
  canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  #error { position: fixed; inset: 24px; color: #fff; font: 16px/1.5 system-ui; white-space: pre-wrap; }
</style>
<canvas id="app" tabindex="0" aria-label="Rusterize"></canvas>
<div id="error" role="alert" hidden></div>
<script type="module">
  import { start } from './rusterize.js';
  const showError = error => {
    console.error(error);
    const notice = document.getElementById('error');
    notice.textContent = `Не удалось запустить приложение.\n${error.message}`;
    notice.hidden = false;
  };
  start(document.getElementById('app'), new URL('./app.wasm', import.meta.url), {
    onError: showError,
  }).then(app => { window.rusterize = app; }).catch(showError);
</script>
</html>
